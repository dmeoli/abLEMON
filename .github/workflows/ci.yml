# Build and test of lemon-ng on every operating system it supports: Linux
# with GCC and Clang, macOS with AppleClang and Windows with MSVC, each from
# the oldest C++ standard it accepts to the latest, with all the warnings on.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# a new push on a branch cancels the run of the push before it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the lines that a pull request changes, in the style of the repository
  # code-style, with the changes that put them there posted as suggestions
  style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the style of the changed lines
        uses: dmeoli/code-style@v1

  build-test:
    name: ${{ matrix.os }} ${{ matrix.cc }} C++${{ matrix.std }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++,     std: 11 }
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++,     std: 17 }
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++,     std: 20,
              flags: -D_GLIBCXX_USE_DEPRECATED=0 }
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++,     std: 23,
              flags: -D_GLIBCXX_USE_DEPRECATED=0 }
          - { os: ubuntu-latest,  cc: clang, cxx: clang++, std: 11 }
          - { os: ubuntu-latest,  cc: clang, cxx: clang++, std: 20 }
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++,     std: 20,
              flags: -fsanitize=address,undefined -fno-sanitize-recover=all
                     -fno-omit-frame-pointer,
              name: sanitizers }
          - { os: macos-latest,   cc: clang, cxx: clang++, std: 11 }
          - { os: macos-latest,   cc: clang, cxx: clang++, std: 20 }
          - { os: windows-latest, cc: cl,    cxx: cl,      std: 14 }
          - { os: windows-latest, cc: cl,    cxx: cl,      std: 20 }
          - { os: windows-latest, cc: cl,    cxx: cl,      std: 20,
              cmake: -DBUILD_SHARED_LIBS=ON, name: DLL }
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++,     std: 20,
              cmake: -DBUILD_SHARED_LIBS=ON, name: shared }
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The jobs of GCC in C++20 and later drop from libstdc++ what the
      # standard has removed, as libc++ and MSVC do
      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror ${{ matrix.flags }}"
          -DLEMON_VERSION=ci ${{ matrix.cmake }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_FLAGS="/W3 /EHsc"
          -DLEMON_VERSION=ci ${{ matrix.cmake }}

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 4 -- -k

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4

      - name: Test
        # a test that does not end within 300 s fails, rather than holding
        # the job until GitHub stops it
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          --no-tests=error --timeout 300

  # LEMON installed with the library alone, as a package builds it, and a
  # project built against the installation through its CMake configuration
  # (and on Linux through pkg-config too)
  install:
    name: install on ${{ matrix.os }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
          - { os: windows-latest, cmake: -DBUILD_SHARED_LIBS=ON, name: DLL }
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build and install the library
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          -DLEMON_BUILD_TESTS=NO -DLEMON_BUILD_DEMOS=NO
          -DLEMON_BUILD_TOOLS=NO -DLEMON_BUILD_DOC=NO
          -DLEMON_ENABLE_GLPK=NO -DLEMON_ENABLE_ILOG=NO
          -DLEMON_ENABLE_COIN=NO -DLEMON_ENABLE_SOPLEX=NO ${{ matrix.cmake }}
          && cmake --build build --config Release --parallel 4
          && cmake --install build --config Release

      - name: Build and run a project that uses the installation
        run: >
          cmake -S test/install -B use -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"
          && cmake --build use --config Release

      - name: Run it (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./use/install_test

      - name: Run it (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "${{ github.workspace }}\prefix\bin;$env:PATH"
          ./use/Release/install_test.exe

      - name: Build it through pkg-config (Linux)
        if: runner.os == 'Linux'
        run: >
          g++ test/install/install_test.cc -o pc_test
          $(PKG_CONFIG_PATH="${{ github.workspace }}/prefix/lib/pkgconfig"
          pkg-config --cflags --libs lemon) && ./pc_test

  # the library built static with the LP and MIP solvers of the distribution
  # (GLPK, and Clp and Cbc of COIN-OR), their tests run, and a project that
  # uses the installation, which gets the libraries of the solvers only from
  # the configuration of LEMON, built and run
  lp-backends:
    name: LP and MIP solvers on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install GLPK and COIN-OR
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q libglpk-dev coinor-libcbc-dev
          coinor-libclp-dev

      - name: Build, test and install the library
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          -DLEMON_BUILD_DEMOS=NO -DLEMON_BUILD_TOOLS=NO -DLEMON_BUILD_DOC=NO
          -DLEMON_ENABLE_ILOG=NO -DLEMON_ENABLE_SOPLEX=NO
          && grep -q "define LEMON_HAVE_GLPK" build/lemon/config.h
          && grep -q "define LEMON_HAVE_CBC" build/lemon/config.h
          && cmake --build build --parallel 4
          && ctest --test-dir build --output-on-failure -R "lp_test|mip_test"
          && cmake --install build

      - name: The installed configuration names no path of this machine
        run: "! grep -n /usr/lib prefix/share/lemon/cmake/LEMONTargets*.cmake"

      - name: Build and run a project that uses the installation
        run: >
          cmake -S test/install -B use -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"
          -DLEMON_INSTALL_TEST_LP=ON
          && cmake --build use && ./use/lp_install_test

  # the C++20 module lemon, built by Clang with Ninja, imported by
  # module_test, and its interface the one that the headers give
  module:
    name: C++20 module on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Clang, its scanner of modules and Ninja
        run: >
          sudo apt-get update -q &&
          sudo apt-get install -y -q clang clang-tools ninja-build

      - name: Build the module and run the tests
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release -DLEMON_BUILD_MODULE=ON
          -DLEMON_BUILD_DEMOS=NO -DLEMON_BUILD_TOOLS=NO -DLEMON_BUILD_DOC=NO
          -DLEMON_ENABLE_GLPK=NO -DLEMON_ENABLE_COIN=NO -DLEMON_ENABLE_ILOG=NO
          -DLEMON_ENABLE_SOPLEX=NO
          && grep -q "^LEMON_BUILD_MODULE:BOOL=ON" build/CMakeCache.txt
          && cmake --build build
          && ctest --test-dir build --output-on-failure --timeout 300

      - name: The interface of the module is up to date
        run: python3 scripts/module_exports.py --check -- -Ibuild

  # the lines, functions and branches of lemon/ that the tests run, in the
  # summary of the run, and file by file in its log
  coverage:
    name: coverage on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build with coverage and run the tests
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DLEMON_BUILD_DEMOS=NO -DLEMON_BUILD_TOOLS=NO -DLEMON_BUILD_DOC=NO
          -DLEMON_ENABLE_GLPK=NO -DLEMON_ENABLE_COIN=NO -DLEMON_ENABLE_ILOG=NO
          -DLEMON_ENABLE_SOPLEX=NO
          && cmake --build build --parallel 4
          && ctest --test-dir build --output-on-failure --timeout 300

      - name: Summarize the coverage
        run: |
          pip install -q gcovr
          gcovr -r . --filter 'lemon/' --exclude-throw-branches --txt-summary \
            --txt coverage.txt --markdown-summary "$GITHUB_STEP_SUMMARY" build
          cat coverage.txt

  # SoPlex, which no distribution of Ubuntu packages, from conda-forge, with
  # the configuration that it installs, and a project that links the
  # static library through it
  soplex:
    name: SoPlex on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install SoPlex
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: soplex
          create-args: -c conda-forge soplex zlib
          init-shell: bash

      - name: Build, test and install the library
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          -DSOPLEX_ROOT_DIR="$CONDA_PREFIX"
          -DLEMON_BUILD_DEMOS=NO -DLEMON_BUILD_TOOLS=NO -DLEMON_BUILD_DOC=NO
          -DLEMON_ENABLE_GLPK=NO -DLEMON_ENABLE_COIN=NO -DLEMON_ENABLE_ILOG=NO
          && grep -q "define LEMON_HAVE_SOPLEX" build/lemon/config.h
          && cmake --build build --parallel 4
          && ctest --test-dir build --output-on-failure -R lp_test
          && cmake --install build

      - name: Build and run a project that uses the installation
        run: >
          cmake -S test/install -B use -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"
          -DLEMON_INSTALL_TEST_LP=ON
          && cmake --build use && ./use/lp_install_test

  # the library, the tests, the tools and the demos built with the makefiles
  # instead of CMake, and the tests run, on Linux, macOS (whose sed is the
  # one of BSD) and Windows (MinGW in MSYS2)
  makefiles:
    name: makefiles on ${{ matrix.os }} ${{ matrix.cc }} C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: g++,     std: 11 }
          - { os: ubuntu-latest,  cc: clang++, std: 20 }
          - { os: macos-latest,   cc: clang++, std: 17 }
          - { os: windows-latest, cc: g++,     std: 17 }
    env:
      MK: CC=${{ matrix.cc }} STD=c++${{ matrix.std }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make git mingw-w64-ucrt-x86_64-gcc

      - name: Build and run everything (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make -C test -j4 $MK FLAGS=-Werror check
          make -C tools -j4 $MK
          make -C demo -j4 $MK
          make -f makefile-lib -j4 CC=${{ matrix.cc }}

      - name: Build and run everything (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -C test -j4 $MK FLAGS=-Werror check
          make -C tools -j4 $MK
          make -C demo -j4 $MK
          make -f makefile-lib -j4 CC=${{ matrix.cc }}
