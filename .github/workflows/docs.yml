# The documentation of abLEMON, which Doxygen builds with the target html of
# CMake, the site of the user manual, which MkDocs builds from manual/ into
# the folder manual/ of the same pages, and the API reference that Sphinx
# builds from the XML of Doxygen into the folder sphinx/, published on
# GitHub Pages at every push on master.

name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publication at a time, the last push winning
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Doxygen 1.15, whose layout has the Topics (the groups of
      # doc/groups.dox), which the Doxygen of Ubuntu does not know
      - name: Install Doxygen
        uses: ssciwr/doxygen-install@v1
        with:
          version: "1.15.0"

      - name: Install Ghostscript, Graphviz and BibTeX (for \\cite)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript graphviz texlive-binaries

      - name: Build the documentation
        run: |
          cmake -S . -B build -DLEMON_BUILD_TESTS=NO -DLEMON_BUILD_DEMOS=NO \
            -DLEMON_BUILD_TOOLS=NO -DLEMON_ENABLE_GLPK=NO \
            -DLEMON_ENABLE_ILOG=NO -DLEMON_ENABLE_COIN=NO \
            -DLEMON_ENABLE_SOPLEX=NO
          cmake --build build --target html

      - name: Build the site of the manual
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions
          out="$PWD/build/doc/html/manual"
          # from manual/build, as the Makefile: the snippets are found
          # relative to the directory where MkDocs runs
          cd manual/build && mkdocs build -f mkdocs.yml -d "$out"

      # the pages of README.md and NEWS and the API reference, which
      # sphinx/conf.py writes from the XML that the target html wrote into
      # build/doc/xml; the doctrees stay out of the pages
      - name: Build the Sphinx site
        run: |
          pip install -r sphinx/requirements.txt
          sphinx-build -b html -d build/doctrees sphinx build/doc/html/sphinx

      - name: Upload the pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
