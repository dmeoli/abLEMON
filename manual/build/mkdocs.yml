# MkDocs configuration of the web site of the abLEMON User Manual.
# Usage (from manual/build/):
#     mkdocs serve -f mkdocs.yml      # preview at http://127.0.0.1:8000
#     mkdocs build -f mkdocs.yml      # static site into ../../manual-site/
# docs_dir is the root of the manual, so that index.md, chapters/, figures/
# and examples/ are all visible.

site_name: abLEMON — A User Manual
site_description: >-
  A user manual for abLEMON 1.9.0, the C++ library of graphs and network
  optimization.
site_author: Donato Meoli
docs_dir: ..
site_dir: ../../manual-site
use_directory_urls: false

exclude_docs: |
  build/Makefile
  build/*.yml
  build/*.yaml
  build/*.lua
  build/*.tex
  build/*.py
  examples/
  figures/*.tex
  figures/*.pdf
  OUTLINE.md
  MAINTENANCE.md
  chapters.txt
  abLEMON-manual.pdf

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - build/katex-init.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

nav:
  - Front matter: index.md
  - "Part I: Foundations":
      - "1. Introduction": chapters/01-introduction.md
      - "2. Installation": chapters/02-installation.md
      - "3. Graphs, items and maps": chapters/03-mental-model.md
  - "Part II: Data structures":
      - "4. Graph structures": chapters/04-graphs.md
      - "5. Graph adaptors": chapters/05-adaptors.md
      - "6. Maps": chapters/06-maps.md
      - "7. Heaps": chapters/07-heaps.md
      - "8. Paths and auxiliary structures": chapters/08-auxiliary.md
  - "Part III: Algorithms":
      - "9. Graph search": chapters/09-search.md
      - "10. Shortest paths": chapters/10-shortest-paths.md
      - "11. Spanning trees and arborescences": chapters/11-spanning.md
      - "12. Maximum flows and circulations": chapters/12-max-flow.md
      - "13. Minimum cost flows": chapters/13-min-cost-flow.md
      - "14. Certificates and the k best flows": chapters/14-k-best-flows.md
      - "15. Minimum cuts": chapters/15-min-cut.md
      - "16. Minimum mean cycles": chapters/16-min-mean-cycle.md
      - "17. Matchings": chapters/17-matching.md
      - "18. Connectivity, planarity, isomorphism": chapters/18-properties.md
      - "19. Travelling salesman and maximum clique": chapters/19-tsp-clique.md
      - "20. The LP and MIP interface": chapters/20-lp.md
  - "Part IV: Input, output and tools":
      - "21. Input and output": chapters/21-io.md
      - "22. The tools": chapters/22-tools.md
  - "Part V: Appendices":
      - "A. Writing a graph, a map or a heap": chapters/A-writing-graph-map.md
      - "Y. Glossary": chapters/Y-glossary.md
      - "Z. Bibliography": chapters/Z-bibliography.md
